<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .box-client { fill: #eff6ff; stroke: #3b82f6; }
      .box-router { fill: #f0fdf4; stroke: #22c55e; }
      .box-service { fill: #fefce8; stroke: #eab308; }
      .box-repo { fill: #fdf2f8; stroke: #ec4899; }
      .box-db { fill: #f5f3ff; stroke: #8b5cf6; }
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect width="900" height="500" fill="#ffffff" />
  <text x="450" y="35" text-anchor="middle" class="title">User Registration Architecture Flow (POST /auth/register)</text>

  <!-- Step 1: Client -->
  <rect x="40" y="80" width="140" height="80" class="box box-client" />
  <text x="110" y="110" text-anchor="middle" class="text-title">Client</text>
  <text x="110" y="130" text-anchor="middle" class="text-sub">POST /auth/register</text>
  <text x="110" y="145" text-anchor="middle" class="text-sub">{email, password}</text>

  <!-- Step 2: Router & Schema -->
  <rect x="230" y="80" width="160" height="80" class="box box-router" />
  <text x="310" y="110" text-anchor="middle" class="text-title">Auth Router</text>
  <text x="310" y="130" text-anchor="middle" class="text-sub">Validate RegisterRequest</text>
  <text x="310" y="145" text-anchor="middle" class="text-sub">Inject get_db session</text>

  <!-- Step 3: AuthService -->
  <rect x="440" y="80" width="180" height="80" class="box box-service" />
  <text x="530" y="105" text-anchor="middle" class="text-title">AuthService.register()</text>
  <text x="530" y="125" text-anchor="middle" class="text-sub">1. Check duplicate email</text>
  <text x="530" y="140" text-anchor="middle" class="text-sub">2. Hash password (Argon2)</text>

  <!-- Step 4: UserRepository -->
  <rect x="670" y="80" width="180" height="80" class="box box-repo" />
  <text x="760" y="110" text-anchor="middle" class="text-title">UserRepository</text>
  <text x="760" y="130" text-anchor="middle" class="text-sub">create_user(db, data)</text>
  <text x="760" y="145" text-anchor="middle" class="text-sub">db.add() &amp; db.commit()</text>

  <!-- Top row arrows -->
  <path d="M 180 120 L 230 120" class="arrow" />
  <path d="M 390 120 L 440 120" class="arrow" />
  <path d="M 620 120 L 670 120" class="arrow" />

  <!-- Step 5: Database -->
  <rect x="670" y="240" width="180" height="80" class="box box-db" />
  <text x="760" y="270" text-anchor="middle" class="text-title">PostgreSQL (Supabase)</text>
  <text x="760" y="290" text-anchor="middle" class="text-sub">INSERT INTO users</text>
  <text x="760" y="305" text-anchor="middle" class="text-sub">Table 'users' (Persistent)</text>

  <path d="M 760 160 L 760 240" class="arrow" />
  <text x="770" y="200" class="label">SQL INSERT</text>

  <!-- Return Flow -->
  <rect x="440" y="240" width="180" height="80" class="box box-service" />
  <text x="530" y="270" text-anchor="middle" class="text-title">User Model Entity</text>
  <text x="530" y="290" text-anchor="middle" class="text-sub">User(id=1, email=...,</text>
  <text x="530" y="305" text-anchor="middle" class="text-sub">is_active=True)</text>

  <path d="M 670 280 L 620 280" class="arrow" />

  <rect x="230" y="240" width="160" height="80" class="box box-router" />
  <text x="310" y="270" text-anchor="middle" class="text-title">UserResponse Schema</text>
  <text x="310" y="290" text-anchor="middle" class="text-sub">Sanitizes sensitive data</text>
  <text x="310" y="305" text-anchor="middle" class="text-sub">(Password excluded!)</text>

  <path d="M 440 280 L 390 280" class="arrow" />

  <rect x="40" y="240" width="140" height="80" class="box box-client" />
  <text x="110" y="270" text-anchor="middle" class="text-title">HTTP 201 Created</text>
  <text x="110" y="290" text-anchor="middle" class="text-sub">{id: 1, email: "...",</text>
  <text x="110" y="305" text-anchor="middle" class="text-sub">is_active: true}</text>

  <path d="M 230 280 L 180 280" class="arrow" />

  <!-- Security note box -->
  <rect x="40" y="380" width="810" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4" />
  <text x="60" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="13px" font-weight="bold" fill="#0f172a">Security Best Practice Enforced:</text>
  <text x="60" y="435" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#475569">Passwords are never stored in plaintext. Argon2 automatically salts each password to prevent rainbow table attacks.</text>
</svg>
