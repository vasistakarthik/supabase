<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .box-client { fill: #eff6ff; stroke: #3b82f6; }
      .box-fastapi { fill: #f0fdf4; stroke: #22c55e; }
      .box-static { fill: #fefce8; stroke: #eab308; }
      .box-openapi { fill: #fdf2f8; stroke: #ec4899; }
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect width="850" height="500" fill="#ffffff" />
  <text x="425" y="35" text-anchor="middle" class="title">Swagger UI Offline Workflow</text>

  <!-- Step 1: Client opens /docs -->
  <rect x="50" y="80" width="180" height="70" class="box box-client" />
  <text x="140" y="110" text-anchor="middle" class="text-title">User Browser</text>
  <text x="140" y="130" text-anchor="middle" class="text-sub">GET http://localhost:8000/docs</text>

  <!-- Step 2: FastAPI Custom Handler -->
  <rect x="330" y="80" width="200" height="70" class="box box-fastapi" />
  <text x="430" y="105" text-anchor="middle" class="text-title">FastAPI custom_swagger_ui()</text>
  <text x="430" y="125" text-anchor="middle" class="text-sub">get_swagger_ui_html()</text>
  <text x="430" y="140" text-anchor="middle" class="text-sub">Offline Asset Links</text>

  <!-- Step 3: Local Static Files Mount -->
  <rect x="610" y="80" width="190" height="70" class="box box-static" />
  <text x="705" y="105" text-anchor="middle" class="text-title">StaticFiles (/swagger-ui)</text>
  <text x="705" y="125" text-anchor="middle" class="text-sub">swagger-ui-bundle.js (1MB)</text>
  <text x="705" y="140" text-anchor="middle" class="text-sub">swagger-ui.css (145KB)</text>

  <!-- Arrows row 1 -->
  <path d="M 230 115 L 330 115" class="arrow" />
  <text x="280" y="105" text-anchor="middle" class="label">1. Request</text>

  <path d="M 530 115 L 610 115" class="arrow" />
  <text x="570" y="105" text-anchor="middle" class="label">2. Serve JS/CSS</text>

  <!-- Step 4: Browser fetches /openapi.json -->
  <rect x="610" y="240" width="190" height="80" class="box box-openapi" />
  <text x="705" y="270" text-anchor="middle" class="text-title">OpenAPI 3.0.3 Generator</text>
  <text x="705" y="290" text-anchor="middle" class="text-sub">Reflects Routers, Models</text>
  <text x="705" y="305" text-anchor="middle" class="text-sub">&amp; HTTPBearer Security</text>

  <path d="M 705 150 L 705 240" class="arrow" />
  <text x="715" y="200" class="label">3. Load Client Engine</text>

  <!-- Step 5: Return openapi.json to Browser -->
  <rect x="330" y="240" width="200" height="80" class="box box-fastapi" />
  <text x="430" y="270" text-anchor="middle" class="text-title">/openapi.json</text>
  <text x="430" y="290" text-anchor="middle" class="text-sub">Endpoint schemas,</text>
  <text x="430" y="305" text-anchor="middle" class="text-sub">DTOs &amp; Authorization</text>

  <path d="M 610 280 L 530 280" class="arrow" />
  <text x="570" y="270" text-anchor="middle" class="label">4. JSON Specs</text>

  <!-- Step 6: Render Interactive UI -->
  <rect x="50" y="240" width="180" height="80" class="box box-client" />
  <text x="140" y="270" text-anchor="middle" class="text-title">Interactive Swagger UI</text>
  <text x="140" y="290" text-anchor="middle" class="text-sub">API list, Try It Out buttons,</text>
  <text x="140" y="305" text-anchor="middle" class="text-sub">Authorize 🔓 modal</text>

  <path d="M 330 280 L 230 280" class="arrow" />
  <text x="280" y="270" text-anchor="middle" class="label">5. Render</text>

  <!-- Feature callout box -->
  <rect x="50" y="370" width="750" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4" />
  <text x="70" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="13px" font-weight="bold" fill="#0f172a">Zero External CDN Dependencies</text>
  <text x="70" y="425" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#475569">Operates seamlessly in air-gapped corporate environments without requesting external scripts from cdn.jsdelivr.net</text>
  <text x="70" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#475569">Favicon uses inline Base64 data URI to prevent DNS / network timeouts on startup.</text>
</svg>
